<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f5;
            margin: 0;
            padding: 0;
        }

        .wrapper {
            width: 100%;
            table-layout: fixed;
            background-color: #f4f4f5;
            padding-bottom: 40px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-top: 40px;
        }

        .header {
            padding: 40px 0;
            text-align: center;
            background-color: #ffffff;
            border-bottom: 1px solid #f4f4f5;
        }

        .content {
            padding: 40px 48px;
            color: #18181b;
            text-align: left;
        }

        .h1 {
            font-size: 24px;
            font-weight: 700;
            color: #18181b;
            margin: 0 0 24px 0;
            text-align: center;
        }

        .text {
            font-size: 16px;
            line-height: 1.6;
            color: #52525b;
            margin: 0 0 32px 0;
        }

        .highlight {
            color: #18181b;
            font-weight: 700;
        }

        /* Buttons */
        .btn-container {
            text-align: center;
            margin-top: 40px;
        }

        .btn {
            display: inline-block;
            padding: 14px 30px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 6px;
            margin: 10px;
            min-width: 180px;
            text-align: center;
            transition: all 0.2s;
        }

        /* Pink Primary Button */
        .btn-primary {
            background-color: #db2777;
            color: #ffffff !important;
            border: 2px solid #db2777;
        }

        /* Outline Secondary Button - Optional/Removed for simplicity or matched to Primary */
        .btn-outline {
            background-color: #ffffff;
            color: #db2777;
            border: 2px solid #db2777;
        }

        .footer {
            padding: 30px;
            text-align: center;
            font-size: 12px;
            color: #a1a1aa;
            background-color: #fafafa;
            border-top: 1px solid #f4f4f5;
        }

        .link-fallback {
            color: #db2777;
            word-break: break-all;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="container">

            <!-- LOGO HEADER -->
            <div class="header">
                <!-- REPLACE THE SRC BELOW WITH YOUR ACTUAL LOGO URL -->
                <img src="https://enopolypayment.onrender.com/logo.png" alt="{{company_name}}" height="50"
                    style="height: 50px; width: auto; display: block; margin: 0 auto;">
            </div>
            <!-- CONTENT -->
            <div class="content">
                <!-- Dynamic Title: "Invoice Due" or "Payment Receipt" -->
                <h1 class="h1">{{title}}</h1>

                <p class="text">
                    Hello <strong>{{customer_name}}</strong>,
                    <br><br>
                    <!-- Dynamic Message -->
                    <!-- Invoice: "Please click the link below to view and pay your invoice." -->
                    <!-- Receipt: "Thank you for your payment! Your transaction ID is ..." -->
                    {{message}}
                    <br><br>

                    <!-- Invoice Details -->
                    <span
                        style="display: block; background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #f4f4f5;">
                        Invoice #: <span class="highlight">{{invoice_number}}</span><br>
                        Total Amount: <span class="highlight">${{amount}}</span>
                    </span>
                </p>
                <!-- BUTTONS -->
                <div class="btn-container">
                    <!-- Dynamic Action Text: "Pay Now" or "Download Receipt" -->
                    <a href="{{link}}" class="btn btn-primary">{{action_text}}</a>
                </div>

                <p class="text" style="margin-top: 40px; font-size: 14px; color: #71717a;">
                    Or copy this link:<br>
                    <a href="{{link}}" class="link-fallback">{{link}}</a>
                </p>
            </div>
            <!-- FOOTER -->
            <div class="footer">
                &copy; {{year}} {{company_name}}. All rights reserved.
            </div>
        </div>
    </div>
</body>

</html>
